name: Figer les dépendances Go (une fois)

# Tâche à usage unique (24/10/2026). Le serveur se construisait sans go.sum :
# chaque build Render faisait `go mod tidy` et résolvait ses bibliothèques à
# la volée. Cette tâche, lancée par sa propre publication :
#   1. résout les dépendances une bonne fois (go.mod complet + go.sum) ;
#   2. vérifie que le serveur compile et passe go vet ;
#   3. fait construire Render à partir de cette liste figée
#      (`go mod download` au lieu de `go mod tidy`).
# Le jeton GitHub ne peut pas modifier les fichiers de .github/workflows :
# cette tâche est retirée, et la vérification du backend mise à jour, à la
# main juste après.
# Si une étape échoue, rien n'est poussé et le site ne bouge pas.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/figer-dependances-go.yml'

permissions:
  contents: write

jobs:
  figer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Résoudre les dépendances une fois
        run: go mod tidy

      - name: Vérifier que le serveur compile avec cette liste
        run: |
          go mod verify
          go build ./...
          go vet ./...

      - name: Construire à partir de la liste figée
        run: |
          sed -i 's/RUN go mod tidy \&\& /RUN go mod download \&\& /' Dockerfile
          grep -q 'go mod download' Dockerfile
          sed -i 's/        run: go mod tidy/        run: go mod download \&\& go mod verify/' .github/workflows/verifier-le-backend.yml
          grep -q 'go mod verify' .github/workflows/verifier-le-backend.yml
          git rm -q .github/workflows/figer-dependances-go.yml

      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum Dockerfile
          git commit -m "Serveur : dépendances Go figées (go.sum) et build sans go mod tidy"
          git push
