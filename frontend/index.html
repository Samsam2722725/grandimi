<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Sans HTTPS, l'origine http:// n'est pas autorisee par le CORS de l'API :
      // toutes les requetes echouent en NetworkError. Redirection avant tout rendu.
      if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <!-- Pixel Whop (biz_nqh5U5JaSMUVS7).

         Mesure d’attribution publicitaire : il dit à Whop quelles visites
         viennent de quelle campagne, et les relie aux achats faits sur
         leur page de paiement.

         Placé dans le <head>, comme la documentation Whop le demande, et
         APRÈS la redirection HTTPS ci-dessus : inutile de compter une vue
         sur une page qui va être rechargée dans la seconde.

         Ce fichier est la coquille de TOUTE l’application — accueil,
         questionnaire, résultat, paywall sont le même document HTML. Le
         pixel couvre donc l’intégralité du tunnel avec une seule pose.

         Snippet repris tel quel, sans modifier un caractère.

         L’achat lui-même n’a pas besoin d’événement : il se conclut sur la
         page de paiement de Whop, qui le compte elle-même. Un événement
         « purchase » manuel ne sert que pour un encaissement extérieur. -->
    <script>!function(w,d,s,u,n,a,b){if(w[n])return;a=w[n]={q:[],t:+new Date,s:[],o:u,track:function(){a.q.push([+new Date].concat([].slice.call(arguments)))},setScope:function(){a.s=[].slice.call(arguments).filter(function(x){return typeof x==="string"});a.q.push([+new Date,"setScope"].concat(a.s))},scope:function(){var c=[].slice.call(arguments);return{track:function(){a.q.push([+new Date].concat([].slice.call(arguments)).concat([{__scope:c}]))}}}};b=d.createElement(s);b.async=1;b.src=u+"/s.js";d.getElementsByTagName(s)[0].parentNode.insertBefore(b,d.getElementsByTagName(s)[0])}(window,document,"script","https://t.whop.tw","whop");whop.setScope("biz_nqh5U5JaSMUVS7");whop.track("page");</script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7f2" />
    <!-- Titre et description : écrits pour la recherche, pas pour la marque.

         « Grandimi — Le plan pour atteindre ta taille adulte » ne contenait
         aucun mot que quelqu’un tape. Sur un domaine sans notoriété, un titre
         de marque ne se positionne sur rien : personne ne cherche « Grandimi ».
         Le titre porte donc maintenant la requête que le produit sert
         exactement — calculer sa taille adulte — et garde la marque en queue,
         là où elle coûte peu de caractères.

         Longueur visée : moins de ~60 caractères pour le titre et ~155 pour la
         description, au-delà Google tronque et la fin est perdue.

         Les balises og:/twitter: plus bas ne suivent PAS cette réécriture,
         volontairement : elles servent le partage entre ados sur TikTok et
         WhatsApp, où une promesse vaut mieux qu’un mot-clé. Deux canaux, deux
         accroches. -->
    <meta
      name="description"
      content="Quelle sera ta taille adulte ? Estimation en 2 minutes par la méthode Khamis-Roche croisée aux courbes OMS, marge d’erreur affichée. Dès 29,99 €/an, ou 9,99 €/mois."
    />
    <title>Calculer sa taille adulte : estimation en 2 min — Grandimi</title>

    <link rel="canonical" href="https://grandimi.com/" />

    <!-- Partage social.

         Sans ces balises, tout lien partagé — et le trafic vient de
         TikTok et de conversations WhatsApp entre ados — s'affiche en
         URL nue : pas de titre, pas d'image, rien qui donne envie
         d'ouvrir. Le site avait déjà une carte de résultat partageable
         (lib/share-card.js) mais pas de carte pour le site lui-même.

         Les robots des réseaux sociaux n'exécutent PAS le JavaScript :
         ces balises doivent être écrites ici, en dur, et non posées par
         React au montage. Même raison pour l'image, qui doit être une
         URL absolue et un PNG (le SVG est refusé par Facebook, X,
         LinkedIn et WhatsApp).

         og-image.png : 1200 × 630, généré une fois, à la charte du site
         (fond sombre, courbe corail, ± 4 cm affiché — l'argument du
         produit tient dans la vignette). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grandimi" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://grandimi.com/" />
    <meta property="og:title" content="Prends tous les centimètres qu’il te reste — Grandimi" />
    <meta
      property="og:description"
      content="Ta taille adulte estimée par deux méthodes croisées, et 11 actions par jour choisies d’après tes réponses."
    />
    <meta property="og:image" content="https://grandimi.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Grandimi — courbe de croissance et marge d'erreur de ± 4 cm"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prends tous les centimètres qu’il te reste — Grandimi" />
    <meta
      name="twitter:description"
      content="Ta taille adulte estimée, et 11 actions par jour pour aller chercher les centimètres qu’il te reste."
    />
    <meta name="twitter:image" content="https://grandimi.com/og-image.png" />

    <!-- Données structurées.

         Volontairement sans "offers" ni "aggregateRating" :
         - un prix ici serait une TROISIÈME copie des montants, après
           internal/billing/plans.go et le texte de la landing ; une copie
           oubliée afficherait un faux prix dans Google, ce qui est pire
           que pas de prix du tout ;
         - une note agrégée supposerait des avis. Les faux témoignages ont
           été retirés du site pour cette raison exacte, les réintroduire
           en JSON-LD serait la même faute, simplement moins visible. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Grandimi",
        "url": "https://grandimi.com/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "inLanguage": "fr-FR",
        "description": "Estimation de la taille adulte par la méthode Khamis-Roche croisée avec les tables de croissance de l’OMS, suivie d’un plan quotidien de 11 actions renouvelé chaque mois.",
        "audience": { "@type": "PeopleAudience", "suggestedMinAge": 10, "suggestedMaxAge": 22 },
        "publisher": { "@id": "https://grandimi.com/#organisation" }
      }
    </script>

    <!-- L'éditeur, déclaré comme entité.

         Les six pages de contenu se disent toutes publiées par « Grandimi ».
         Tant que cette organisation n'est déclarée nulle part, ce nom n'est
         qu'une chaîne de caractères répétée sept fois : rien ne dit qu'il
         s'agit du même éditeur, ni qui il est. L'`@id` ci-dessous est ce qui
         relie les sept déclarations à une entité unique.

         Sur un sujet de santé qui s'adresse à des mineurs, savoir QUI publie
         est un critère d'évaluation, pas une décoration.

         Deux champs manquent sciemment :
         - `logo`, qui demande un vrai logotype carré en PNG. og-image.png est
           une bannière 1200 × 630 : la donner ici serait déclarer un logo
           faux plutôt que pas de logo ;
         - `sameAs`, qui relierait les comptes TikTok et Instagram. C'est le
           gain le plus rapide qui reste sur cette page — mais il demande les
           vraies URL, et une URL inventée vaut moins que rien. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://grandimi.com/#organisation",
        "name": "Grandimi",
        "url": "https://grandimi.com/",
        "email": "grandimi14@gmail.com",
        "foundingLocation": { "@type": "Country", "name": "France" },
        "description": "Éditeur de Grandimi, outil d’estimation de la taille adulte et de plan de croissance quotidien pour les 10-22 ans."
      }
    </script>
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <!-- CDN plus rapide : fonts.bunny.net (clone libre de Google Fonts).
         Sur mobile 4G lente, évite 500ms de latence vs googleapis.com.

         Réduit aussi les variantes : Fraunces seulement 400/500/600 au
         lieu de 9..144 optical size qui gonflait le fichier. Le contenu
         utilise essentiellement ces poids, donc pas de perte visuelle.

         media="print" + onload = charge sans bloquer le rendu. Le texte
         s'affiche d'abord dans la police de repli (Arial/system), puis
         bascule vers Fraunces et DM Sans une fois chargées (display=swap). -->
    <link
      href="https://fonts.bunny.net/css?family=dm-sans:400,500,600,700|fraunces:400,500,600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.bunny.net/css?family=dm-sans:400,500,600,700|fraunces:400,500,600&display=swap" rel="stylesheet" />
    </noscript>
  </head>
  <body>
    <!-- ============================================================
         COQUILLE DU HERO — le haut de la page, ecrit en dur.

         POURQUOI. Ce fichier n'envoyait qu'un <div id="root"> vide. Le
         telephone devait donc telecharger 660 ko de JavaScript ET les
         executer avant de peindre le moindre pixel. Rapport PageSpeed du
         19/09/2026, Moto G Power en 4G lente : First Contentful Paint a
         3,5 s, Largest Contentful Paint a 6,0 s — soit 6 points sur les
         35 que valent ces deux mesures. Aucun reglage ne contourne un
         document vide.

         CE QU'IL Y A ICI, ET PAS PLUS. L'en-tete et la colonne gauche du
         hero : titre, sous-titre, bouton. C'est l'element le plus grand
         de l'ecran sur mobile, donc celui qui porte le LCP. Les trois
         telephones ne sont pas repris — ils pesent 35 ko de balisage et
         se trouvent sous la ligne de flottaison sur telephone.

         L'EN-TETE EST LA POUR UNE RAISON PRECISE. Sans lui, le titre se
         peindrait 77 px trop haut, puis redescendrait quand React monte.
         C'est exactement le decalage de mise en page que ce changement
         doit eviter : le CLS vaut 25 des 100 points du score, et il est
         a 0 aujourd'hui. Le perdre couterait plus que le LCP ne rapporte.

         LES BOUTONS SONT DES <span>. Rien n'est cliquable avant que
         React ne monte ; un <button> qui ne repond pas est pire qu'un
         texte qui n'en a pas l'air. React remplace tout ce bloc au
         montage par la vraie version, interactive.

         A REGENERER QUAND LE HERO CHANGE. Ce balisage est une copie
         figee de ce que rend HomePage.jsx. Si le titre, le sous-titre ou
         l'en-tete changent la-bas sans etre reportes ici, le visiteur
         verra l'ancienne version pendant deux secondes puis la nouvelle
         — et le decalage reviendra. C'est le prix de cette technique
         sans outil de pre-rendu.
         ============================================================ -->
    <div id="root"><div class="app"><div class="theme-night"><main><header class="sticky top-0 z-50 border-b border-[color:var(--color-frost-gray)] bg-[color:var(--surface-page-canvas)]"><div class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-4 sm:px-8"><a href="#" class="flex min-w-0 items-center gap-2.5 text-ink"><span class="flex size-8 items-center justify-center rounded-[9px] bg-brand"></span><span class="truncate font-display text-xl font-semibold tracking-[-0.02em]">Grandimi</span></a><nav class="hidden items-center gap-8 md:flex"><a href="#fonctionnalites" class="text-[13px] font-semibold tracking-[0.06em] text-[color:var(--text-secondary)] uppercase">Fonctionnalités</a><a href="#faq" class="text-[13px] font-semibold tracking-[0.06em] text-[color:var(--text-secondary)] uppercase">FAQ</a><a href="/questions-croissance/" class="text-[13px] font-semibold tracking-[0.06em] text-[color:var(--text-secondary)] uppercase">Guides</a></nav><div class="flex shrink-0 items-center gap-2 sm:gap-3"><span class="inline-flex min-h-11 shrink-0 items-center rounded-full px-2 text-sm font-semibold whitespace-nowrap text-ink sm:border sm:border-ink sm:px-6">Se connecter</span><span class="hidden min-h-11 shrink-0 items-center gap-2 rounded-full bg-brand px-4 text-sm font-semibold whitespace-nowrap text-[color:var(--color-on-brand)] sm:inline-flex sm:px-6">Commencer</span></div></div></header><section class="relative overflow-hidden border-b border-[color:var(--color-frost-gray)]"><div class="relative isolate overflow-hidden px-6 pt-16 pb-20 sm:px-8 lg:pt-24 lg:pb-28"><div aria-hidden="true" class="pointer-events-none absolute -top-40 left-1/2 z-0 size-[680px] -translate-x-1/2 rounded-full bg-[color:var(--color-coral-pulse)] opacity-[0.17] blur-[140px]"></div><div class="relative z-10 mx-auto flex w-full max-w-3xl flex-col items-center text-center"><p class="inline-flex items-center gap-2 rounded-full border border-[color:var(--color-brand-display)]/40 bg-[#2a1109] px-4 py-1.5 text-[13px] font-semibold text-[color:var(--color-brand-display)]"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-3.5 shrink-0" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 20.99a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.774a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>Basé sur la science</p><h1 class="night-title-gradient mt-7 font-display text-[clamp(44px,7.2vw,88px)] leading-[0.98] font-medium tracking-[-0.045em] text-balance">Prédis et <span class="text-[color:var(--color-brand-display)]">maximise</span> ta taille.</h1><p class="mt-6 max-w-xl text-[clamp(17px,2.4vw,21px)] leading-[1.5] text-pretty text-[color:var(--text-secondary)]">Tu ne contrôles pas tes gènes, mais tu peux <span class="text-[color:var(--color-brand-display)] font-semibold">optimiser ta croissance</span>. Grandimi te dit où tu en es, et quoi faire chaque jour.</p><div class="mt-10"><span style="display:inline-flex;align-items:center;justify-content:center;width:256px;height:47px;border-radius:100px;background:#ff5a1f;font-size:14px;font-weight:600;color:#17120e">Commencer mon analyse</span></div></div></div></section></main></div></div></div>
