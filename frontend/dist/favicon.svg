<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Favicon Grandimi.

    Le fond orange est PLEIN et va bord à bord, sans coins arrondis : chaque
    système arrondit la vignette à sa façon (iOS, Android, onglets de bureau),
    et un rayon dessiné ici se retrouverait rogné deux fois, avec un liseré
    orange dans l'angle.

    Le trou de la petite tête laisse volontairement voir l'orange du fond
    plutôt qu'un blanc posé : sur la marque, ce point n'est pas une pièce
    supplémentaire, c'est le vide de l'anneau.

    Géométrie identique à src/components/ui/logo-grandimi.jsx — si l'une
    change, l'autre change le même jour, sinon l'onglet et l'en-tête du site
    n'affichent plus le même logo.
  -->
  <rect width="100" height="100" fill="#FF4F17"/>

  <g stroke="#262626" fill="none">
    <circle cx="30.5" cy="46" r="11.5" stroke-width="6"/>
    <rect x="19" y="61" width="23" height="34" rx="11.5" stroke-width="6"/>
  </g>

  <g fill="#262626">
    <circle cx="69.5" cy="22" r="13.5"/>
    <rect x="56" y="40" width="27" height="55" rx="13.5"/>
  </g>
</svg>
