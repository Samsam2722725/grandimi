    <!-- Titre et description : écrits pour la recherche, pas pour la marque.

         « Grandimi — Le plan pour atteindre ta taille adulte » ne contenait
         aucun mot que quelqu’un tape. Sur un domaine sans notoriété, un titre
         de marque ne se positionne sur rien : personne ne cherche « Grandimi ».
         Le titre porte donc maintenant la requête que le produit sert
         exactement — calculer sa taille adulte — et garde la marque en queue,
         là où elle coûte peu de caractères.

         Longueur visée : moins de ~60 caractères pour le titre et ~155 pour la
         description, au-delà Google tronque et la fin est perdue.

         Les balises og:/twitter: plus bas ne suivent PAS cette réécriture,
         volontairement : elles servent le partage entre ados sur TikTok et
         WhatsApp, où une promesse vaut mieux qu’un mot-clé. Deux canaux, deux
         accroches. -->
    <meta
      name="description"
      content="Quelle sera ta taille adulte ? Estimation en 2 minutes par la méthode Khamis-Roche croisée aux courbes OMS, marge d’erreur affichée. Dès 4,99 €/mois."
    />
    <title>Calculer sa taille adulte : estimation en 2 min — Grandimi</title>

    <link rel="canonical" href="https://grandimi.com/" />

    <!-- Partage social.

         Sans ces balises, tout lien partagé — et le trafic vient de
         TikTok et de conversations WhatsApp entre ados — s'affiche en
         URL nue : pas de titre, pas d'image, rien qui donne envie
         d'ouvrir. Le site avait déjà une carte de résultat partageable
         (lib/share-card.js) mais pas de carte pour le site lui-même.

         Les robots des réseaux sociaux n'exécutent PAS le JavaScript :
         ces balises doivent être écrites ici, en dur, et non posées par
         React au montage. Même raison pour l'image, qui doit être une
         URL absolue et un PNG (le SVG est refusé par Facebook, X,
         LinkedIn et WhatsApp).

         og-image.png : 1200 × 630, généré une fois, à la charte du site
         (fond sombre, courbe corail, ± 4 cm affiché — l'argument du
         produit tient dans la vignette). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grandimi" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://grandimi.com/" />
    <meta property="og:title" content="Prends tous les centimètres qu’il te reste — Grandimi" />
    <meta
      property="og:description"
      content="Ta taille adulte estimée par deux méthodes croisées, et 11 actions par jour choisies d’après tes réponses."
    />
    <meta property="og:image" content="https://grandimi.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Grandimi — courbe de croissance et marge d'erreur de ± 4 cm"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prends tous les centimètres qu’il te reste — Grandimi" />
    <meta
      name="twitter:description"
      content="Ta taille adulte estimée, et 11 actions par jour pour aller chercher les centimètres qu’il te reste."
    />
    <meta name="twitter:image" content="https://grandimi.com/og-image.png" />

    <!-- Données structurées.

         Volontairement sans "offers" ni "aggregateRating" :
         - un prix ici serait une TROISIÈME copie des montants, après
           internal/billing/plans.go et le texte de la landing ; une copie
           oubliée afficherait un faux prix dans Google, ce qui est pire
           que pas de prix du tout ;
         - une note agrégée supposerait des avis. Les faux témoignages ont
           été retirés du site pour cette raison exacte, les réintroduire
           en JSON-LD serait la même faute, simplement moins visible. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Grandimi",
        "url": "https://grandimi.com/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "inLanguage": "fr-FR",
        "description": "Estimation de la taille adulte par la méthode Khamis-Roche croisée avec les tables de croissance de l’OMS, suivie d’un plan quotidien de 11 actions renouvelé chaque mois.",
        "audience": { "@type": "PeopleAudience", "suggestedMinAge": 10, "suggestedMaxAge": 22 },
        "publisher": { "@id": "https://grandimi.com/#organisation" }
      }
    </script>

    <!-- L'éditeur, déclaré comme entité.

         Les six pages de contenu se disent toutes publiées par « Grandimi ».
         Tant que cette organisation n'est déclarée nulle part, ce nom n'est
         qu'une chaîne de caractères répétée sept fois : rien ne dit qu'il
         s'agit du même éditeur, ni qui il est. L'`@id` ci-dessous est ce qui
         relie les sept déclarations à une entité unique.

         Sur un sujet de santé qui s'adresse à des mineurs, savoir QUI publie
         est un critère d'évaluation, pas une décoration.

         Deux champs manquent sciemment :
         - `logo`, qui demande un vrai logotype carré en PNG. og-image.png est
           une bannière 1200 × 630 : la donner ici serait déclarer un logo
           faux plutôt que pas de logo ;
         - `sameAs`, qui relierait les comptes TikTok et Instagram. C'est le
           gain le plus rapide qui reste sur cette page — mais il demande les
           vraies URL, et une URL inventée vaut moins que rien. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://grandimi.com/#organisation",
        "name": "Grandimi",
        "url": "https://grandimi.com/",
        "email": "grandimi14@gmail.com",
        "foundingLocation": { "@type": "Country", "name": "France" },
        "description": "Éditeur de Grandimi, outil d’estimation de la taille adulte et de plan de croissance quotidien pour les 10-22 ans."
      }
    </script>

         64, dont 1 260 ms perdus en « requetes de blocage du rendu ».

         vers fonts.googleapis.com et attend sa reponse avant de peindre
         quoi que ce soit.

         media="print" la fait charger sans bloquer ; onload la rebascule
         sur "all" des qu'elle est la. Le noscript garde le cas sans
         JavaScript. Les polices portent deja display=swap, donc le texte
         s'affiche dans la police de repli puis bascule — ce qui se
         produisait deja, seulement plus tard.

         A SURVEILLER : le CLS vaut 0 aujourd'hui, soit 25 points sur 100.
         Si la bascule de police se met a decaler la mise en page, ce
         changement coute plus qu'il ne rapporte et doit etre annule. -->
