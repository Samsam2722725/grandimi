<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Sans HTTPS, l'origine http:// n'est pas autorisee par le CORS de l'API :
      // toutes les requetes echouent en NetworkError. Redirection avant tout rendu.
      if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7f2" />
    <meta
      name="description"
      content="11 actions par jour, du lever au coucher, pour aller chercher les centimètres qu’il te reste. Ton estimation de départ est gratuite et sans compte."
    />
    <title>Grandimi — Le plan pour atteindre ta taille adulte</title>

    <link rel="canonical" href="https://grandimi.com/" />

    <!-- Partage social.

         Sans ces balises, tout lien partagé — et le trafic vient de
         TikTok et de conversations WhatsApp entre ados — s'affiche en
         URL nue : pas de titre, pas d'image, rien qui donne envie
         d'ouvrir. Le site avait déjà une carte de résultat partageable
         (lib/share-card.js) mais pas de carte pour le site lui-même.

         Les robots des réseaux sociaux n'exécutent PAS le JavaScript :
         ces balises doivent être écrites ici, en dur, et non posées par
         React au montage. Même raison pour l'image, qui doit être une
         URL absolue et un PNG (le SVG est refusé par Facebook, X,
         LinkedIn et WhatsApp).

         og-image.png : 1200 × 630, généré une fois, à la charte du site
         (fond sombre, courbe corail, ± 4 cm affiché — l'argument du
         produit tient dans la vignette). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Grandimi" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://grandimi.com/" />
    <meta property="og:title" content="Prends tous les centimètres qu’il te reste — Grandimi" />
    <meta
      property="og:description"
      content="11 actions par jour, du lever au coucher, choisies d’après tes réponses. Ton estimation de départ est gratuite, sans compte."
    />
    <meta property="og:image" content="https://grandimi.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Grandimi — courbe de croissance et marge d'erreur de ± 4 cm"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prends tous les centimètres qu’il te reste — Grandimi" />
    <meta
      name="twitter:description"
      content="11 actions par jour pour aller chercher les centimètres qu’il te reste. Estimation de départ gratuite."
    />
    <meta name="twitter:image" content="https://grandimi.com/og-image.png" />

    <!-- Données structurées.

         Volontairement sans "offers" ni "aggregateRating" :
         - un prix ici serait une TROISIÈME copie des montants, après
           internal/billing/plans.go et le texte de la landing ; une copie
           oubliée afficherait un faux prix dans Google, ce qui est pire
           que pas de prix du tout ;
         - une note agrégée supposerait des avis. Les faux témoignages ont
           été retirés du site pour cette raison exacte, les réintroduire
           en JSON-LD serait la même faute, simplement moins visible. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Grandimi",
        "url": "https://grandimi.com/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web",
        "inLanguage": "fr-FR",
        "description": "Plan de croissance quotidien personnalisé — 11 actions par jour, renouvelé chaque mois — précédé d’une estimation gratuite de la taille adulte.",
        "audience": { "@type": "PeopleAudience", "suggestedMinAge": 12, "suggestedMaxAge": 25 }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-DL6uj6kd.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D4goRz2I.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
