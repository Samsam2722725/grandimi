<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — Grandimi</title>
    <!--
      GitHub Pages sert sa propre page d'erreur quand ce fichier n'existe
      pas : un visiteur qui se trompe d'adresse, ou qui suit un lien coupé
      en deux par une messagerie, voyait « Page not found · GitHub Pages »
      sur grandimi.com. Sur un site qui demande une carte bancaire, ça se
      lit comme un site cassé.

      Le site est une application d'une seule page : il n'existe aucune
      URL avec un chemin. Toute adresse inconnue est donc une faute de
      frappe ou un lien tronqué, et la bonne destination est l'accueil.
      La redirection préserve la requête (?parent=..., ?status=...) pour
      ne pas casser le retour de paiement ni le lien parent si le chemin
      a été abîmé en route.
    -->
    <script>
      location.replace('/' + location.search + location.hash);
    </script>
    <style>
      body {
        margin: 0;
        padding: 48px 24px;
        background: #0a0a0a;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .bloc { max-width: 420px; margin: 0 auto; }
      a { color: #ff5a1f; }
    </style>
  </head>
  <body>
    <!-- Visible seulement si le JavaScript est coupé. -->
    <div class="bloc">
      <p style="margin: 0 0 28px; font-size: 14px; letter-spacing: 3px; font-weight: 700; color: #ff5a1f;">
        GRANDIMI
      </p>
      <h1 style="margin: 0 0 12px; font-size: 24px; font-weight: 600;">Cette page n’existe pas</h1>
      <p style="margin: 0 0 24px; line-height: 1.55; color: #9a9a9a;">
        L’adresse a peut-être été coupée en deux par ta messagerie.
      </p>
      <p style="margin: 0;"><a href="/">Aller à l’accueil</a></p>
    </div>
  </body>
</html>
